<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFS Mock Host - Local Plugin Simulator</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --primary: #c15c3d;
      --code-bg: #1e1e1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    header { margin-bottom: 20px; }
    h1 { font-size: 20px; color: var(--primary); margin-bottom: 6px; }
    p { font-size: 13px; color: #57606a; }
    .layout { display: grid; grid-template-columns: 460px 1fr; gap: 20px; align-items: start; }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .panel h2 { font-size: 14px; margin-bottom: 12px; font-weight: 600; text-transform: uppercase; color: #57606a; }
    iframe { width: 100%; height: 580px; border: 1px solid var(--border); border-radius: 6px; background: white; }
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { background: var(--primary); color: white; border: none; border-radius: 4px; padding: 8px 12px; font-size: 12px; font-weight: 500; cursor: pointer; }
    button:hover { opacity: 0.9; }
    button.secondary { background: #57606a; }
    .btn-download-link {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-download-link:hover { opacity: 0.9; }
    #log { background: var(--code-bg); color: #d4d4d4; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; height: 480px; overflow-y: auto; padding: 12px; border-radius: 6px; line-height: 1.5; }
    .log-entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #333; }
    .log-in { color: #4ec9b0; }
    .log-out { color: #ce9178; }
    .log-meta { color: #808080; font-size: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Oracle Field Service (OFS) Plugin Local Simulator</h1>
    <p>Simulates the OFS host application (parent window) to test plugin lifecycle, callProcedure RPC, and submissions without a live OFS tenant.</p>
  </header>

  <div class="layout">
    <!-- Left: Plugin Iframe Container -->
    <div class="panel">
      <h2>Embedded Plugin (Iframe)</h2>
      <iframe id="pluginFrame" src="index.html"></iframe>
    </div>

    <!-- Right: Mock Host Controls & Message Log -->
    <div class="panel">
      <h2>Host Actions & Message Inspector</h2>
      <div class="controls">
        <div class="btn-row">
          <button id="sendOpenBtn" type="button">Send "open" (Activity #1001)</button>
          <button id="sendOpenAltBtn" class="secondary" type="button">Send "open" (Activity #2002)</button>
          <a href="plugin.zip" download="plugin.zip" class="btn-download-link" id="downloadZipBtn" title="Download plugin.zip to your Downloads folder">📦 Download plugin.zip</a>
          <button id="clearLogBtn" class="secondary" type="button">Clear Log</button>
        </div>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("pluginFrame");
    const logDiv = document.getElementById("log");

    function log(direction, method, data) {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const dirClass = direction === "FROM_PLUGIN" ? "log-in" : "log-out";
      const dirText = direction === "FROM_PLUGIN" ? "⬅️ IN (Plugin to OFS)" : "➡️ OUT (OFS to Plugin)";
      const time = new Date().toLocaleTimeString();

      entry.innerHTML = `
        <div class="log-meta">${time} | <span class="${dirClass}">${dirText}</span> | <strong>${method}</strong></div>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      `;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Listen for messages from the embedded plugin iframe
    window.addEventListener("message", function(event) {
      let data = event.data;
      try {
        if (typeof data === "string") data = JSON.parse(data);
      } catch (e) { return; }

      if (!data || !data.method) return;

      log("FROM_PLUGIN", data.method, data);

      // 1. When plugin sends "ready", host replies with "init"
      if (data.method === "ready") {
        setTimeout(() => {
          const initPayload = {
            apiVersion: 1,
            method: "init",
            applications: {
              ofs_rest_api: { type: "oauth" },
              oic_integration: { type: "oauth" }
            }
          };
          log("TO_PLUGIN", "init", initPayload);
          iframe.contentWindow.postMessage(JSON.stringify(initPayload), "*");
        }, 300);
      }

      // 2. When plugin sends "initEnd", host automatically opens the plugin
      if (data.method === "initEnd") {
        setTimeout(() => sendOpenMessage("1001", "TECH_JDOE"), 400);
      }

      // 3. When plugin calls callProcedure
      if (data.method === "callProcedure") {
        setTimeout(() => {
          if (data.procedure === "getAccessToken") {
            const resultMsg = {
              apiVersion: 1,
              method: "callProcedureResult",
              callId: data.callId,
              resultData: {
                token: "mock_jwt_token_for_" + (data.params?.applicationKey || "app"),
                status: "success"
              }
            };
            log("TO_PLUGIN", "callProcedureResult (" + data.procedure + ")", resultMsg);
            iframe.contentWindow.postMessage(JSON.stringify(resultMsg), "*");
          } else if (data.procedure === "scanBarcode") {
            const resultMsg = {
              apiVersion: 1,
              method: "callProcedureResult",
              callId: data.callId,
              resultData: {
                format: "QR_CODE",
                text: "OFS-EQUIP-998877"
              }
            };
            log("TO_PLUGIN", "callProcedureResult (" + data.procedure + ")", resultMsg);
            iframe.contentWindow.postMessage(JSON.stringify(resultMsg), "*");
          }
        }, 500);
      }

      // 4. When plugin sends "close"
      if (data.method === "close") {
        alert("OFS Host received 'close'!\nSubmitted actions: " + JSON.stringify(data.actions || [], null, 2));
      }
    });

    function sendOpenMessage(aid, resourceId) {
      const openPayload = {
        apiVersion: 1,
        method: "open",
        openParams: {
          aid: aid,
          activeAid: aid,
          resourceId: resourceId
        },
        allowedProcedures: {
          scanBarcode: true
        }
      };
      log("TO_PLUGIN", "open (aid: " + aid + ")", openPayload);
      iframe.contentWindow.postMessage(JSON.stringify(openPayload), "*");
    }

    document.getElementById("sendOpenBtn").addEventListener("click", () => sendOpenMessage("1001", "TECH_JDOE"));
    document.getElementById("sendOpenAltBtn").addEventListener("click", () => sendOpenMessage("2002", "TECH_MSMITH"));
    document.getElementById("clearLogBtn").addEventListener("click", () => { logDiv.innerHTML = ""; });
  </script>
</body>
</html>
